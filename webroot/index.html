<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JunkClean</title>
<style>
:root{--bg:#050509;--bg2:#0a0a13;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f2f2f7;--muted:#9a9aa8;--dim:#5c5c6a;--accent:#2dd4a7;--accent2:#7c5cff;--accentSoft:rgba(45,212,167,.14);--warn:#fbbf24;--danger:#fb7185;--glow:0 0 24px rgba(45,212,167,.18);--r-lg:22px;--r-md:14px;--ease:cubic-bezier(.32,.72,0,1);font:500 15px/1.5 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{color:var(--text);min-height:100dvh;padding:16px 12px 0;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:#050509 url("https://aplm123.eu.cc/file/img:AgACAgUAAxkDAAIBWGpbkgABXVwUc5_tkiIL9U3H0-iUhQAC8Q9rGzGM4FZooVhJqx_M7wEAAwIAA3cAAz0E.jpg") center/cover no-repeat fixed;filter:brightness(.7)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(5,5,9,.35);backdrop-filter:blur(2px)}
#app{max-width:480px;margin:0 auto;width:100%;flex:1;padding-bottom:0}
.card{position:relative;background:rgba(255,255,255,.045);border-radius:18px;padding:20px;z-index:1;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card::before{content:"";position:absolute;inset:-1.5px;border-radius:22px;background:rgba(255,255,255,.02);border:1px solid var(--line);z-index:-1;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 20px rgba(0,0,0,.3);transition:border-color .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-2px)}
.card:hover::before{border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 32px rgba(0,0,0,.4),var(--glow)}
.badge{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted)}
.badge-safe{background:var(--accentSoft);color:var(--accent)}
.badge-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.badge-careful{background:rgba(251,113,133,.16);color:var(--danger)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:99px;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s var(--ease),opacity .3s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),#059669);color:#fff;font-size:17px;margin:16px 0;box-shadow:0 4px 28px rgba(45,212,167,.28)}
.btn-primary:hover{box-shadow:0 6px 36px rgba(45,212,167,.4);transform:translateY(-1px)}
.btn-clean{background:linear-gradient(135deg,var(--danger),#e11d48);color:#fff;padding:12px 20px;font-size:14px;box-shadow:0 4px 20px rgba(251,113,133,.2)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#e11d48);color:#fff;padding:14px 28px;font-size:15px;box-shadow:0 4px 20px rgba(251,113,133,.22)}
.btn-secondary{background:var(--surface);color:var(--muted);padding:14px 28px;font-size:15px;border:1px solid var(--line)}
.btn-secondary:hover{color:var(--text);border-color:var(--line2)}
/* 能量环（存储环升级：刻度 + 辉光） */
.ring-wrap{position:relative;width:170px;height:170px;margin:4px auto 14px}
.ring{transform:rotate(-90deg);width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(45,212,167,.25))}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:9}
.ring-fg{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.ring-tick{stroke:rgba(255,255,255,.14);stroke-width:1.5}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center span:first-child{font-size:34px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ring-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.storage-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.storage-info .storage-row{display:flex;flex-direction:column;gap:2px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.storage-row span:first-child{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.storage-row span:last-child{font-size:15px;font-weight:600}

/* 工具箱网格 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tool-card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s var(--ease);font-size:12px;color:var(--muted);position:relative}
.tool-card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.35),var(--glow);color:var(--text)}
.tool-card .ti{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:12px;background:radial-gradient(circle at 30% 25%,rgba(45,212,167,.18),rgba(124,92,255,.12));border:1px solid var(--line)}
.tool-card.on{background:var(--accentSoft);border-color:rgba(45,212,167,.4);color:var(--accent)}
.tool-card .dot{position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.tool-card.on .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* 面板 */
.panel{position:fixed;inset:0;background:rgba(3,3,8,.78);backdrop-filter:blur(16px);z-index:250;display:flex;flex-direction:column;animation:fadeIn .25s var(--ease)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,10,19,.9),rgba(10,10,19,.6))}
.panel-head h3{font-size:16px;font-weight:700}
.panel-close{background:var(--surface);border:1px solid var(--line);border-radius:99px;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:16px;transition:all .3s}
.panel-close:hover{color:var(--text);border-color:var(--line2);transform:rotate(90deg)}
.panel-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.panel-body .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body input,.panel-body select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;flex:1;min-width:100px;transition:border-color .3s}
.panel-body input:focus,.panel-body select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,212,167,.12)}
.panel-body button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 16px;color:var(--text);font-size:13px;cursor:pointer;transition:all .25s var(--ease)}
.panel-body button:hover{border-color:var(--line2)}
.panel-body button:active{transform:scale(.95)}
.panel-body button.primary{background:linear-gradient(135deg,var(--accent),#059669);border:none;color:#fff;box-shadow:0 3px 14px rgba(45,212,167,.25)}
.panel-body button.danger{background:linear-gradient(135deg,var(--danger),#e11d48);border:none;color:#fff;box-shadow:0 3px 14px rgba(251,113,133,.22)}
.panel-body button:disabled{opacity:.4;cursor:default}
.panel-list{display:flex;flex-direction:column;gap:8px}
.panel-item{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s}
.panel-item:hover{border-color:var(--line2)}
.panel-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-item .sz{color:var(--muted);white-space:nowrap}
.panel-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.panel-note{font-size:11px;color:var(--muted);line-height:1.7}
.panel-empty{text-align:center;color:var(--dim);padding:28px 0;font-size:13px}

/* 进度 */
.progress-card{margin:16px 0;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.progress-bar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 12px rgba(45,212,167,.5)}
.progress-text{font-size:13px;font-weight:600;color:var(--accent)}
.progress-path{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 底部栏 */
.bottom-bar{position:static;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;backdrop-filter:blur(16px)}
.select-all{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.select-all input{width:18px;height:18px;accent-color:var(--accent)}

/* 开关（辉光） */
.switch{position:relative;width:46px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:99px;transition:.3s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.switch input:checked + .sl{background:linear-gradient(135deg,var(--accent),#059669);box-shadow:0 0 12px rgba(45,212,167,.5)}
.switch input:checked + .sl:before{transform:translateX(21px)}

/* 柱状图 */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bar .b{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s var(--ease);box-shadow:0 0 8px rgba(45,212,167,.25)}
.bar .bl{font-size:9px;color:var(--dim)}

/* header + 动画 */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.hdr-logo{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.hdr-logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-btn{background:var(--surface);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--muted);transition:all .3s}
.hdr-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--line2)}
.section-title{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
.cat-card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .3s var(--ease)}
.cat-card:hover{border-color:var(--line2);transform:translateY(-1px)}
.cat-hdr{display:flex;align-items:center;gap:12px}
.cat-icon{font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:radial-gradient(circle at 30% 25%,rgba(45,212,167,.15),rgba(124,92,255,.1));border:1px solid var(--line)}
.cat-info{flex:1}
.cat-name{font-weight:600;font-size:15px}
.cat-desc{font-size:11px;color:var(--dim);margin-top:2px}
.cat-size{font-weight:700;font-size:16px;color:var(--accent)}
.cat-check{margin-left:8px;width:19px;height:19px;accent-color:var(--accent)}
.cat-items{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;flex-direction:column;gap:6px}
.cat-items.open{display:flex}
.item-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13px;transition:background .2s}
.item-row:hover{background:var(--surface2)}
.item-row .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .item-size{color:var(--muted);white-space:nowrap}
.item-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

/* 抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:360px;background:rgba(10,10,19,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--line);z-index:300;padding:24px;overflow-y:auto;animation:slideRight .35s var(--ease);display:flex;flex-direction:column;gap:16px}
.drawer h2{font-size:18px;margin-bottom:8px;font-weight:700}
.drawer label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.drawer textarea,.drawer input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
.drawer textarea:focus,.drawer input:focus{outline:none;border-color:var(--accent)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299}
.drawer .close-btn{position:absolute;top:16px;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:99px;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:16px}
.drawer .log-area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;font-family:monospace;color:var(--muted);max-height:200px;overflow-y:auto;white-space:pre-wrap}

/* 遮罩弹层（清理确认） */
.overlay{position:fixed;inset:0;background:rgba(3,3,8,.7);backdrop-filter:blur(14px);display:flex;align-items:end;justify-content:center;z-index:200;padding:20px;animation:fadeIn .3s var(--ease)}
.overlay-sheet{background:rgba(16,16,28,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:var(--r-lg);padding:24px;width:100%;max-width:440px;animation:slideUp .45s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.overlay-sheet h3{font-size:18px;margin-bottom:12px;font-weight:700}
.overlay-sheet p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.overlay-actions{display:flex;gap:12px;justify-content:flex-end}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

.bar-hero{text-align:center;padding:6px 0 2px}
.bar-num{font-size:42px;font-weight:800;background:linear-gradient(135deg,#fff,#2dd4a7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bar-label{font-size:11px;color:#5c5c6a;text-transform:uppercase;letter-spacing:.16em;margin-top:2px}
.bar-track{height:16px;border-radius:99px;background:#ffffff12;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);margin:14px 0}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#2dd4a7,#7c5cff);border-radius:99px;box-shadow:0 0 18px #2dd4a766;transition:width .7s cubic-bezier(.32,.72,0,1)}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:#9a9aa8}

/* 三 Tab */
.page{animation:pageIn .4s cubic-bezier(.32,.72,0,1)}
.page[hidden],.panel[hidden],.bottom-bar[hidden],.overlay[hidden]{display:none}
.page-head{display:flex;flex-direction:column;gap:2px;margin:6px 0 16px}
.page-eyebrow{font-size:10px;letter-spacing:.22em;color:#5c5c6a;text-transform:uppercase;font-weight:700}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff,#2dd4a7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
.tabnav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(12,12,22,.82);border:1px solid var(--line);border-radius:99px;padding:4px;backdrop-filter:blur(24px);z-index:120;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:99px;background:transparent;color:#9a9aa8;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.32,.72,0,1)}
.tab .ti{font-size:16px}
.tab.active{background:linear-gradient(135deg,#2dd4a7,#059669);color:#fff;box-shadow:0 3px 14px rgba(45,212,167,.35)}
.tab:active{transform:scale(.95)}
#page-settings .card{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
#page-settings .card h3{font-size:14px;font-weight:700}
#page-settings label{font-size:13px;color:#9a9aa8;display:flex;flex-direction:column;gap:4px}
#page-settings input,#page-settings textarea{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;width:100%;box-sizing:border-box}
#page-settings input:focus,#page-settings textarea:focus{outline:none;border-color:#2dd4a7}
#page-settings .log-area{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;font-family:monospace;color:#9a9aa8;max-height:180px;overflow-y:auto;white-space:pre-wrap}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.tool-panel{position:relative;background:rgba(255,255,255,.045);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 2px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.tool-panel-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.tp-ico{font-size:20px}
.tp-name{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.tool-panel-body{display:flex;flex-direction:column;gap:12px}
.tool-panel-body .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool-panel-body input,.tool-panel-body select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;flex:1;min-width:90px}
.tool-panel-body input:focus,.tool-panel-body select:focus{outline:none;border-color:#2dd4a7}
.tool-panel-body button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:9px 16px;color:var(--text);font-size:13px;cursor:pointer;transition:all .25s cubic-bezier(.32,.72,0,1)}
.tool-panel-body button:active{transform:scale(.95)}
.tool-panel-body button.primary{background:linear-gradient(135deg,#2dd4a7,#059669);border:none;color:#fff}
.tool-panel-body button.danger{background:linear-gradient(135deg,#fb7185,#e11d48);border:none;color:#fff}
.tool-panel-body button:disabled{opacity:.4;cursor:default}
.panel-list{display:flex;flex-direction:column;gap:8px}
.panel-item{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px)}
.panel-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-item .sz{color:#9a9aa8;white-space:nowrap}
.panel-item input[type=checkbox]{width:16px;height:16px;accent-color:#2dd4a7}
.panel-note{font-size:11px;color:#9a9aa8;line-height:1.7}
.panel-empty{text-align:center;color:#5c5c6a;padding:20px 0;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bar .b{width:100%;background:linear-gradient(180deg,#2dd4a7,#7c5cff);border-radius:6px 6px 2px 2px;min-height:2px;box-shadow:0 0 8px rgba(45,212,167,.25)}
.bar .bl{font-size:9px;color:#5c5c6a}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:99px;transition:.3s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked + .sl{background:linear-gradient(135deg,#2dd4a7,#059669)}
.switch input:checked + .sl:before{transform:translateX(20px)}

</style>
</head>
<body>

<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2dd4a7"/><stop offset="100%" stop-color="#7c5cff"/></linearGradient>
</defs></svg>

  <div class="page" id="page-home">
  <header class="hdr">
    <div class="hdr-logo">🧹<span>JunkClean</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge" id="rootBadge">root</span>
      
    </div>
  </header>

  <section class="card" id="storageCard">
    <div class="bar-hero">
      <div class="bar-num" id="freeDisk">--</div>
      <div class="bar-label">可用空间</div>

<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const fmt = b => {
  if (b >= 1<<30) return (b/(1<<30)).toFixed(1)+' GB';
  if (b >= 1<<20) return (b/(1<<20)).toFixed(1)+' MB';
  if (b >= 1<<10) return (b/(1<<10)).toFixed(0)+' KB';
  return b+' B';
};
// 绝对地址：WebView(ksu:///ap://) 与浏览器(http://127.0.0.1:46780) 双通道可用
const api = async (path, opts={}) => {
  try {
    const r = await fetch('http://127.0.0.1:46780/api'+path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
    return await r.json();
  } catch(e) { return {error: '网络错误: ' + e.message}; }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- state ----------
let state = { cats: [], selected: new Set() };

// ---------- storage ring ----------
function renderBar(pct) {
  $('fillDisk').style.width = Math.min(pct,100) + '%';
  $('usedPct').textContent = Math.round(pct) + '%';
}
function renderDisk(d) {
  if (!d) return;
  $('totalDisk').textContent = fmt(d.total);
  $('usedDisk').textContent = fmt(d.used);
  $('freeDisk').textContent = fmt(d.free);
  renderBar(d.percent);
}


// ---------- status ----------
async function refreshStatus() {
  const s = await api('/status');
  if (s.disk) renderDisk(s.disk);
  $('rootBadge').textContent = s.root ? 'root' : '⚠ 非root';
  $('rootBadge').className = 'badge ' + (s.root ? 'badge-safe' : 'badge-warn');
  return s;
}
</script>
<script>
// ---------- scan flow ----------
let scanTimer = null;
async function startScan(force) {
  $('scanBtn').disabled = true;
  $('scanBtn').style.opacity = .5;
  $('progressCard').hidden = false;
  $('results').hidden = true;
  $('bottomBar').hidden = true;
  $('progressFill').style.width = '0%';
  $('progressText').textContent = '扫描中...';
  const r = await api('/scan' + (force?'?force=1':''), {method:'POST', body:'{}'});
  if (r.status === 'cached') { finishScan(); return; }
  pollProgress();
}
async function pollProgress() {
  const s = await api('/status');
  const sc = s.scan;
  if (sc.done) { finishScan(); return; }
  $('progressPath').textContent = sc.curPath || '...';
  $('progressText').textContent = `已发现 ${fmt(sc.bytes)} · 共 ${sc.found} 项`;
  scanTimer = setTimeout(pollProgress, 700);
}
async function finishScan() {
  clearTimeout(scanTimer);
  $('scanBtn').disabled = false;
  $('scanBtn').style.opacity = 1;
  $('progressCard').hidden = true;
  const res = await api('/result');
  state.cats = res.categories || [];
  state.selected = new Set();
  renderResults();
  $('results').hidden = false;
  $('bottomBar').hidden = state.cats.length === 0;
  $('totalSize').textContent = fmt(res.total);
  $('cleanallBtn').onclick = async () => {
    if (!confirm('一键清理所有安全分类？')) return;
    $('cleanallBtn').disabled = true;
    $('cleanallBtn').textContent = '清理中...';
    const r = await api('/cleanall', {method:'POST', body:'{}'});
    $('cleanallBtn').disabled = false;
    $('cleanallBtn').textContent = '一键全清';
    const f = r.freed || 0;
    const b = r.before; const a = r.after;
    const msg = '释放 ' + fmt(f);
    if (b && a) msg += ' · 清理前 ' + fmt(b.used) + ' → 清理后 ' + fmt(a.used);
    alert(msg + ' ✅');
    refreshStatus();
    $('bottomBar').hidden = true;
    $('results').hidden = true;
  };
}

// ---------- render results ----------
function renderResults() {
  const list = $('catList');
  list.innerHTML = '';
  state.cats.forEach((cat, ci) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    const careful = cat.careful ? '<span class="badge badge-careful">谨慎</span>' : '';
    card.innerHTML = `
      <div class="cat-hdr" data-ci="${ci}">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-info">
          <div class="cat-name">${esc(cat.name)} ${careful}</div>
          <div class="cat-desc">${esc(cat.desc)}</div>
        </div>
        <div class="cat-size">${fmt(cat.total)}</div>
        <input type="checkbox" class="cat-check" data-ci="${ci}" ${cat.careful?'':'checked'}>
      </div>
      <div class="cat-items" id="items-${ci}"></div>`;
    const itemsBox = card.querySelector('.cat-items');
    cat.items.forEach((it, ii) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `<input type="checkbox" data-key="${ci}:${ii}" ${cat.careful?'':'checked'}><span class="item-name">${esc(it.name)}</span><span class="item-size">${fmt(it.size)}</span>`;
      itemsBox.appendChild(row);
    });
    card.querySelector('.cat-hdr').addEventListener('click', e => {
      if (e.target.type === 'checkbox') return;
      itemsBox.classList.toggle('open');
    });
    card.querySelector('.cat-check').addEventListener('change', e => {
      const cc = e.target;
      itemsBox.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = cc.checked);
      syncSelected();
    });
    itemsBox.addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const all = [...itemsBox.querySelectorAll('input[type=checkbox]')];
        const catCheck = card.querySelector('.cat-check');
        catCheck.checked = all.every(c => c.checked);
        catCheck.indeterminate = !catCheck.checked && all.some(c => c.checked);
        syncSelected();
      }
    });
    list.appendChild(card);
  });
  syncSelected();
}

function syncSelected() {
  state.selected = new Set();
  document.querySelectorAll('.item-row input:checked').forEach(cb => {
    state.selected.add(cb.dataset.key);
  });
  const total = [...state.selected].reduce((sum, k) => {
    const [ci, ii] = k.split(':').map(Number);
    return sum + state.cats[ci].items[ii].size;
  }, 0);
  $('cleanBtn').textContent = `清理 (${fmt(total)})`;
  $('cleanBtn').disabled = total === 0;
  const all = document.querySelectorAll('.item-row input').length;
  const checked = document.querySelectorAll('.item-row input:checked').length;
  $('selectAll').checked = all > 0 && checked === all;
  $('selectAll').indeterminate = checked > 0 && checked < all;
}

// ---------- clean flow ----------
async function doClean() {
  const ids = [...state.selected].map(k => {
    const [ci, ii] = k.split(':').map(Number);
    return state.cats[ci].items[ii].id;
  });
  const total = [...state.selected].reduce((sum, k) => {
    const [ci, ii] = k.split(':').map(Number);
    return sum + state.cats[ci].items[ii].size;
  }, 0);
  $('confirmSummary').textContent = `将清理 ${ids.length} 个目标，预计释放 ${fmt(total)}。此操作不可恢复！`;
  $('overlay').hidden = false;
  $('confirmBtn').onclick = async () => {
    $('overlay').hidden = true;
    const btn = $('cleanBtn');
    btn.disabled = true;
    btn.textContent = '清理中...';
    const r = await api('/clean', {method:'POST', body: JSON.stringify({ids})});
    const f = r.freed || 0;
    const b = r.before; const a = r.after;
    let msg = '已释放 ' + fmt(f);
    if (b && a) msg += ' · 清理前 ' + fmt(b.used) + ' → 清理后 ' + fmt(a.used);
    btn.textContent = msg + ' ✓';
    setTimeout(() => { btn.textContent = '清理 (0 B)'; btn.disabled = true; }, 3500);
    $('bottomBar').hidden = true;
    $('results').hidden = true;
    refreshStatus();
  };
}
$('cancelBtn').onclick = () => $('overlay').hidden = true;
$('cleanBtn').onclick = doClean;
$('selectAll').onchange = e => {
  document.querySelectorAll('.item-row input').forEach(cb => cb.checked = e.target.checked);
  syncSelected();
};

// ---------- settings drawer ----------
async function loadSettings() {
  const c = await api('/config');
  $('wlInput').value = (c.whitelist||[]).join('\n');
  $('aiEndpoint').value = c.aiEndpoint||'';
  $('aiKey').value = c.aiKey||'';
  $('aiModel').value = c.aiModel||'';
  $('bgUrl').value = c.bgUrl||'';
  applyBg(c.bgUrl);
  const lg = await api('/logs');
  $('logArea').textContent = (lg.logs||[]).join('\n') || '暂无日志';
}
function applyBg(url) {
  let s = document.getElementById('bgStyle');
  if (!s) { s = document.createElement('style'); s.id = 'bgStyle'; document.head.appendChild(s); }
  const u = (url||'').trim();
  s.textContent = u ? 'body::before{background:#050509 url("' + u + '") center/cover no-repeat fixed!important}' : '';
}
function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== 'page-' + name; });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if (name === 'settings') loadSettings();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));

  $('hotBtn').onclick = async () => {
    const el = $('hotResult');
    const url = $('hotUrl').value.trim();
    if (!url) { el.textContent = '⚠ 请输入 zip 下载地址'; return; }
    el.textContent = '⏳ 下载中...';
    $('hotBtn').disabled = true;
    try {
      const r = await api('/hotupdate', {method:'POST', body: JSON.stringify({url})});
      if (r.error) { el.textContent = '❌ ' + r.error; $('hotBtn').disabled = false; }
      else { el.textContent = '✅ ' + r.msg + '，刷新页面即可'; }
    } catch(e) { el.textContent = '❌ 请求失败: ' + e; $('hotBtn').disabled = false; }
  };
  $('hotRollback').onclick = async () => {
    if (!confirm('回滚到备份版本？')) return;
    const r = await api('/rollback', {method:'POST', body:'{}'});
    alert(r.msg || '回滚成功，页面将刷新');
    setTimeout(() => location.reload(), 2000);
  };
$('saveCfgBtn').onclick = async () => {
  await api('/config', {method:'POST', body: JSON.stringify({
    whitelist: $('wlInput').value.split('\n').map(s=>s.trim()).filter(Boolean),
    aiEndpoint: $('aiEndpoint').value.trim(),
    aiKey: $('aiKey').value.trim(),
    aiModel: $('aiModel').value.trim(),
    bgUrl: $('bgUrl').value.trim()
  })});
  applyBg($('bgUrl').value);
  alert('已保存 ✓');
};

// ---------- init ----------
$('scanBtn').onclick = () => startScan(false);
$('forceScanBtn').onclick = () => startScan(true);
refreshStatus();
setInterval(refreshStatus, 5000);

// ========== 工具箱 ==========
const TOOLS = [
  {id:'big', icon:'📁', name:'大文件'}, {id:'empty', icon:'📄', name:'空文件'},
  {id:'thumb', icon:'🖼️', name:'缩略图'}, {id:'classify', icon:'📂', name:'整理中心'},
  {id:'duplicate', icon:'👯', name:'重复文件'}, {id:'trash', icon:'🗑️', name:'回收站'},
  {id:'cleanapp', icon:'📱', name:'应用清理'}, {id:'schedule', icon:'⏰', name:'定时任务'},
  {id:'monitor', icon:'📡', name:'监控'}, {id:'stats', icon:'📊', name:'统计'},
  {id:'fstrim', icon:'⚡', name:'fstrim'}, {id:'ai', icon:'🤖', name:'AI建议'},
];
function initTools() {
  const page = $('toolsPage');
  page.innerHTML = TOOLS.map(t => `
    <div class="tool-panel" id="card-${t.id}">
      <div class="tool-panel-head"><span class="tp-ico">${t.icon}</span><span class="tp-name">${t.name}</span></div>
      <div class="tool-panel-body" id="body-${t.id}"></div>
    </div>`).join('');
  TOOLS.forEach(t => { currentTool = t.id; openTool(t.id); });
}
let currentTool = '';
function openPanel(title, html) {
  const b = $('body-' + currentTool);
  if (b) b.innerHTML = html;
}
$('toolClose').onclick = () => $('toolPanel').hidden = true;
$('toolPanel').onclick = e => { if (e.target === $('toolPanel')) $('toolPanel').hidden = true; };

// 通用：勾选列表工具
function renderCheckList(items, elId) {
  const el = $(elId);
  if (!items.length) { el.innerHTML = '<div class="panel-empty">未发现</div>'; return; }
  el.innerHTML = items.map((it,i) => `
    <div class="panel-item" data-path="${esc(it.path)}"><input type="checkbox" data-i="${i}"><span class="nm">${esc(it.name)}</span><span class="sz">${fmt(it.size)}</span></div>`).join('');
}
function checkedPaths(elId) {
  const out = [];
  $(elId).querySelectorAll('input:checked').forEach(cb => {
    const it = $(elId).querySelectorAll('.panel-item')[+cb.dataset.i];
    out.push(it.dataset.path || it.querySelector('.nm').textContent);
  });
  return out;
}

// --- 大文件 ---
function toolBig() {
  openPanel('📁 大文件', `
    <div class="row">
      <input id="bigMin" type="number" value="50" placeholder="阈值MB" style="flex:.4">
      <input id="bigExt" placeholder="扩展名(逗号,如 jpg,mp4)" style="flex:1">
    </div>
    <div class="row">
      <select id="bigDays" style="flex:.5"><option value="0">不限时间</option><option value="1">1天前</option><option value="7">7天前</option><option value="30">30天前</option></select>
      <button class="primary" id="bigScan" style="flex:1">🔍 扫描</button>
    </div>
    <div class="panel-list" id="bigList"></div>
    <div class="row"><button class="danger" id="bigDel">删除选中</button><button id="bigTrash">移入回收站</button><button id="bigAll">全选</button></div>`);
  let bigItems = [];
  $('bigScan').onclick = async () => {
    const min = (($('bigMin').value||50) * 1048576);
    const ext = encodeURIComponent($('bigExt').value.trim());
    const days = +$('bigDays').value || 0;
    const items = await api('/big?min=' + min + '&ext=' + ext + '&days=' + days);
    bigItems = items.items||[];
    renderBig(bigItems);
  };
  const renderBig = (list) => {
    const el = $('bigList');
    el.innerHTML = list.length ? list.map((it,i) => `
      <div class="panel-item" data-path="${esc(it.path)}"><input type="checkbox" data-i="${i}"><span class="nm">${esc(it.name)}</span><span class="sz">${fmt(it.size)}</span></div>`).join('')
      : '<div class="panel-empty">未发现大文件</div>';
  };
  $('bigAll').onclick = () => $('bigList').querySelectorAll('input').forEach(c=>c.checked=true);
  $('bigDel').onclick = async () => {
    const paths = checkedPaths('bigList');
    if (!paths.length) return;
    if (!confirm('确认删除 ' + paths.length + ' 个文件？')) return;
    const r = await api('/delete', {method:'POST', body: JSON.stringify({paths, toTrash:false})});
    alert('已删除，释放 ' + fmt(r.freed||0));
    $('bigScan').onclick();
  };
  $('bigTrash').onclick = async () => {
    const paths = checkedPaths('bigList');
    if (!paths.length) return;
    const r = await api('/delete', {method:'POST', body: JSON.stringify({paths, toTrash:true})});
    alert('已移入回收站，释放 ' + fmt(r.freed||0));
    $('bigScan').onclick();
  };
}
// --- 空文件 ---
function toolEmpty() {
  openPanel('📄 空文件', `
    <div class="row"><button class="primary" id="emptyScan">扫描 0 字节文件</button></div>
    <div class="panel-list" id="emptyList"></div>
    <div class="row"><button class="danger" id="emptyDel">清理选中</button></div>`);
  $('emptyScan').onclick = async () => {
    const items = await api('/empty');
    renderCheckList(items.items||[], 'emptyList');
  };
    $('emptyDel').onclick = async () => {
    const paths = checkedPaths('emptyList');
    if (!paths.length) return;
    if (!confirm('确认删除 ' + paths.length + ' 个空文件？')) return;
    const r = await api('/delete', {method:'POST', body: JSON.stringify({paths, toTrash:false})});
    alert('已清理，释放 ' + fmt(r.freed||0));
    $('emptyScan').onclick();
  };
}

// --- 缩略图 ---
function toolThumb() {
  openPanel('🖼️ 缩略图缓存', `
    <div class="row"><button class="primary" id="thumbScan">扫描缩略图</button></div>
    <div class="panel-list" id="thumbList"></div>
    <div class="row"><button class="danger" id="thumbDel">清理选中</button></div>`);
  $('thumbScan').onclick = async () => {
    const items = await api('/thumb');
    renderCheckList(items.items||[], 'thumbList');
  };
    $('thumbDel').onclick = async () => {
    const paths = checkedPaths('thumbList');
    if (!paths.length) return;
    if (!confirm('确认删除 ' + paths.length + ' 个缩略图目录？')) return;
    const r = await api('/delete', {method:'POST', body: JSON.stringify({paths, toTrash:false})});
    alert('已清理，释放 ' + fmt(r.freed||0));
    $('thumbScan').onclick();
  };
}

function openTool(id) {
  ({big:toolBig, empty:toolEmpty, thumb:toolThumb, classify:toolClassify, duplicate:toolDuplicate, trash:toolTrash, cleanapp:toolCleanapp, schedule:toolSchedule, monitor:toolMonitor, stats:toolStats, fstrim:toolFstrim, ai:toolAI})[id]();
}
initTools();


// --- 整理中心 ---
function toolClassify() {
  const b = $('body-classify');
  b.innerHTML = '<div class="panel-empty">加载规则...</div>';
  const getRules = async () => (await api('/classify', {method:'POST', body: JSON.stringify({action:'get'})})).rules||[];
  const render = (rules) => {
    const dest = rules.length ? rules[0].dest : '';
    let h = '<div class="panel-note" style="margin-bottom:6px">📁 统一目标（所有规则共用）</div>';
    h += '<div class="row"><input id="clDest" value="' + esc(dest) + '" placeholder="/sdcard/下载"><button id="clSaveDest" style="flex:0">保存</button></div>';
    h += '<div class="row" style="margin-top:8px"><button class="primary" id="clPreview">🔍 预览</button><button id="clRun">⚡ 执行</button><button id="clAddRule">＋ 新增规则</button></div>';
    rules.forEach((rule, ri) => {
      const maps = Object.entries(rule.map||{}).map(([k,v]) => k+'→'+v).join('\n');
      h += '<div class="tool-panel" style="margin:10px 0;padding:14px">';
      h += '<div class="row"><span style="font-size:12px;color:#9a9aa8;flex:0">源路径</span><input data-ri="'+ri+'" class="cl-src" value="'+esc(rule.src)+'" placeholder="/sdcard/Download"></div>';
      h += '<textarea data-ri="'+ri+'" class="cl-maps" rows="3" style="margin:8px 0" placeholder="映射，每行一个：*.jpg→图片">'+esc(maps)+'</textarea>';
      h += '<div class="row" style="justify-content:space-between">';
      h += '<div class="row"><span style="font-size:12px;color:#9a9aa8">🔄 子项目</span><label class="switch"><input type="checkbox" data-ri="'+ri+'" class="cl-rec" '+(rule.recurse?'checked':'')+'><span class="sl"></span></label>';
      h += '<span style="font-size:12px;color:#9a9aa8">🛡 完整性</span><label class="switch"><input type="checkbox" data-ri="'+ri+'" class="cl-int" '+(rule.integrity?'checked':'')+'><span class="sl"></span></label></div>';
      h += '<div class="row"><button data-ri="'+ri+'" class="cl-save" style="padding:6px 14px">保存</button><button data-ri="'+ri+'" class="cl-del" style="background:rgba(251,113,133,.15);color:#fb7185;padding:6px 12px;border:none">删除</button></div>';
      h += '</div></div>';
    });
    h += '<div class="panel-list" id="clList"></div>';
    b.innerHTML = h;
    bind(rules);
  };
  const bind = (rules) => {
    // 统一目标保存
    $('clSaveDest').onclick = async () => {
      const rs = await getRules();
      rs.forEach(r => r.dest = $('clDest').value.trim() || r.dest);
      await api('/classify', {method:'POST', body: JSON.stringify({action:'save', rules: rs})});
      alert('已保存统一目标 ✓');
    };
    // 每条规则独立保存（Src + 映射 + 开关一起）
    document.querySelectorAll('.cl-save').forEach(bn => bn.onclick = async () => {
      const ri = +bn.dataset.ri;
      const rs = await getRules();
      if (!rs[ri]) return;
      rs[ri].src = document.querySelectorAll('.cl-src')[ri].value.trim();
      const map = {};
      document.querySelectorAll('.cl-maps')[ri].value.split('\n').forEach(l => {
        const i = l.indexOf('→');
        if (i > 0) map[l.slice(0,i).trim()] = l.slice(i+1).trim();
      });
      rs[ri].map = map;
      rs[ri].recurse = document.querySelectorAll('.cl-rec')[ri].checked;
      rs[ri].integrity = document.querySelectorAll('.cl-int')[ri].checked;
      await api('/classify', {method:'POST', body: JSON.stringify({action:'save', rules: rs})});
      alert('已保存 ✓');
    });
    // 删除规则
    document.querySelectorAll('.cl-del').forEach(bn => bn.onclick = async () => {
      if (!confirm('删除这条规则？')) return;
      const rs = await getRules();
      rs.splice(+bn.dataset.ri, 1);
      await api('/classify', {method:'POST', body: JSON.stringify({action:'save', rules: rs})});
      render(rs);
    });
    // 新增规则（顶部临时表单）
    $('clAddRule').onclick = async () => {
      const src = prompt('源路径（如 /sdcard/Download）:');
      if (!src) return;
      const rs = await getRules();
      rs.push({src, dest: $('clDest').value.trim(), map: {}, recurse: false, integrity: true});
      await api('/classify', {method:'POST', body: JSON.stringify({action:'save', rules: rs})});
      render(rs);
    };
    // 预览/执行
    $('clPreview').onclick = async () => {
      const r = await api('/classify', {method:'POST', body: JSON.stringify({action:'preview'})});
      $('clList').innerHTML = (r.moves||[]).length ? r.moves.map(m => '<div class="panel-item"><span class="nm">'+esc(m)+'</span></div>').join('') : '<div class="panel-empty">无待整理文件</div>';
    };
    $('clRun').onclick = async () => {
      if (!confirm('执行整理？')) return;
      const r = await api('/classify', {method:'POST', body: JSON.stringify({action:'run'})});
      alert('已整理 '+r.count+' 个文件');
      $('clList').innerHTML = (r.moves||[]).map(m => '<div class="panel-item"><span class="nm">'+esc(m)+'</span></div>').join('');
    };
  };
  getRules().then(render);
}

function toolDuplicate() {
  openPanel('👯 重复文件', `
    <div class="row"><button class="primary" id="dupScan">扫描重复文件</button></div>
    <div class="panel-list" id="dupList"></div>
    <div class="row"><button class="danger" id="dupDel">删除多余副本</button><button id="dupArc">归档副本</button></div>`);
  $('dupScan').onclick = async () => {
    const r = await api('/duplicate', {method:'POST', body: JSON.stringify({action:'preview'})});
    const el = $('dupList');
    const gs = r.groups||[];
    el.innerHTML = gs.length ? gs.map((g,gi) => `
      <div class="panel-item" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;gap:8px;align-items:center"><span class="nm">${g.files[0].split('/').pop()}</span><span class="sz">${g.size} × ${g.files.length} 份</span></div>
        ${g.files.map((f,i)=>`<label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="radio" name="dup-keep-${gi}" value="${esc(f)}" ${i===0?'checked':''}><span class="nm" style="font-size:11px">${esc(f)}</span><span style="color:var(--accent);font-size:10px">${i===0?'保留':''}</span></label>`).join('')}
      </div>`).join('') : '<div class="panel-empty">无重复文件</div>';
  };
  $('dupDel').onclick = async () => {
    const keeps = [];
    document.querySelectorAll('[name^="dup-keep-"]:checked').forEach(r=>keeps.push(r.value));
    const r = await api('/duplicate', {method:'POST', body: JSON.stringify({action:'delete', keep: keeps})});
    alert('已删除 ' + r.deleted + ' 份，释放 ' + fmt(r.freed||0));
    $('dupScan').onclick();
  };
  $('dupArc').onclick = async () => {
    const r = await api('/duplicate', {method:'POST', body: JSON.stringify({action:'archive'})});
    alert('已归档 ' + r.moved + ' 份到 下载/Duplicates');
  };
}

// --- 回收站 ---
function toolTrash() {
  openPanel('🗑️ 回收站', `
    <div class="row">
      <input id="trSearch" placeholder="🔍 搜索" style="flex:1">
      <button class="primary" id="trList">刷新</button>
      <button class="danger" id="trEmpty">清空</button>
    </div>
    <div class="panel-note" id="trSize"></div>
    <div class="panel-list" id="trItems"></div>
    <div class="row"><button id="trRestore">恢复选中</button><button class="danger" id="trDel">彻底删除</button></div>`);
  let items = [];
  const load = async () => {
    const r = await api('/trash', {method:'POST', body: JSON.stringify({action:'list'})});
    items = r.items||[];
    const kw = $('trSearch').value.trim().toLowerCase();
    const list = items.filter(it => !kw || it.orig.toLowerCase().includes(kw));
    const total = items.reduce((s, it) => s + it.size, 0);
    $('trSize').textContent = items.length + ' 项 · 占用 ' + fmt(total);
    const el = $('trItems');
    el.innerHTML = list.length ? list.map((it,i) => `
      <div class="panel-item"><input type="checkbox" data-i="${i}"><span class="nm">${esc(it.orig)}</span><span class="sz">${fmt(it.size)}</span></div>`).join('')
      : '<div class="panel-empty">回收站为空</div>';
    return list;
  };
  $('trList').onclick = load;
  $('trSearch').oninput = load;
  $('trRestore').onclick = async () => {
    const list = await load();
    const paths = [];
    $('trItems').querySelectorAll('input:checked').forEach(cb => paths.push(items[+cb.dataset.i].path));
    if (!paths.length) return;
    await api('/trash', {method:'POST', body: JSON.stringify({action:'restore', paths})});
    load();
  };
  $('trDel').onclick = async () => {
    const list = await load();
    const paths = [];
    $('trItems').querySelectorAll('input:checked').forEach(cb => paths.push(items[+cb.dataset.i].path));
    if (!paths.length) return;
    if (!confirm('彻底删除选中项？')) return;
    await api('/trash', {method:'POST', body: JSON.stringify({action:'delete', paths})});
    load();
  };
  $('trEmpty').onclick = async () => {
    if (!confirm('清空回收站？不可恢复')) return;
    await api('/trash', {method:'POST', body: JSON.stringify({action:'empty'})});
    load();
  };
  load();
}
// --- 应用清理 ---
function toolCleanapp() {
  openPanel('📱 应用清理', `
    <div class="row">
      <input id="caSearch" placeholder="🔍 搜索应用/包名" style="flex:1">
      <button class="primary" id="caScan">扫描缓存</button>
    </div>
    <div class="panel-list" id="caList"></div>
    <div class="row"><button id="caClearAll" style="flex:1">🧹 一键清全部缓存</button></div>`);
  let apps = [];
  const render = () => {
    const el = $('caList');
    const kw = $('caSearch').value.trim().toLowerCase();
    const list = apps.filter(a => !kw || a.package.toLowerCase().includes(kw));
    el.innerHTML = list.length ? list.map((a,i) => `
      <div class="panel-item">
        <img src="ksu://icon/${a.package}" onerror="this.style.display='none'" style="width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.05)">
        <span class="nm">${esc(a.package)}</span>
        <span class="sz">${fmt(a.size)}</span>
        <button data-i="${i}" style="background:var(--danger);color:#fff;padding:3px 8px;font-size:11px;border:none;border-radius:99px;cursor:pointer">清</button>
      </div>`).join('') : '<div class="panel-empty">无缓存应用</div>';
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
      const a = apps[+b.dataset.i];
      if (!confirm('清理 ' + a.package + ' 的缓存？')) return;
      const r = await api('/cleanapp', {method:'POST', body: JSON.stringify({package:a.package})});
      alert('释放 ' + fmt(r.freed||0));
      load();
    });
  };
  const load = async () => {
    const r = await api('/apps');
    apps = r.apps||[];
    render();
  };
  $('caScan').onclick = load;
  $('caSearch').oninput = render;
  $('caClearAll').onclick = async () => {
    if (!confirm('清理全部应用缓存？缓存会重建，安全')) return;
    let total = 0;
    for (const a of apps) {
      const r = await api('/cleanapp', {method:'POST', body: JSON.stringify({package:a.package})});
      total += r.freed||0;
    }
    alert('共释放 ' + fmt(total));
    load();
  };
  load();
}
// --- 定时任务 ---
function toolSchedule() {
  openPanel('⏰ 定时任务', `
    <div class="row">
      <select id="scType"><option value="daily">每日</option><option value="hourly">每小时</option></select>
      <input id="scHour" type="number" min="0" max="23" value="3" placeholder="时">
      <button class="primary" id="scAdd">添加</button>
    </div>
    <div class="panel-list" id="scList"></div>`);
  const load = async () => {
    const r = await api('/schedule', {method:'POST', body: JSON.stringify({action:'list'})});
    const tasks = r.tasks||[];
    $('scList').innerHTML = tasks.length ? tasks.map((t,i) => `
      <div class="panel-item" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="nm" style="font-weight:600">${esc(t.name)}</span>
          <span class="sz">${t.every ? '每'+t.every+'h' : '每日'+t.hour+'时'}</span>
          <button data-id="${t.id}" style="background:var(--danger);color:#fff;padding:4px 10px;font-size:11px;border:none;border-radius:99px;cursor:pointer">删除</button>
        </div>
        ${t.lastRun ? '<div class="panel-note" style="font-size:11px">上次: '+esc(t.lastRun)+' · '+esc(t.lastResult||'ok')+'</div>' : ''}
      </div>`).join('')
      : '<div class="panel-empty">无定时任务</div>';
    $('scList').querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
      await api('/schedule', {method:'POST', body: JSON.stringify({action:'remove', task:{id:b.dataset.id}})});
      load();
    });
  };
  $('scAdd').onclick = async () => {
    const t = $('scType').value === 'hourly'
      ? {name:'每小时清理', every:1}
      : {name:'每日清理', hour: +$('scHour').value || 3};
    await api('/schedule', {method:'POST', body: JSON.stringify({action:'add', task:t})});
    load();
  };
  load();
}

// --- 监控 ---
function toolMonitor() {
  const b = $('body-monitor');
  b.innerHTML = `
    <div class="row">
      <span style="font-size:13px">自动整理监控</span>
      <label class="switch"><input type="checkbox" id="monitorSw"><span class="sl"></span></label>
      <span style="font-size:13px;margin-left:auto">暂停</span>
      <label class="switch"><input type="checkbox" id="monitorPauseSw"><span class="sl"></span></label>
    </div>
    <div class="panel-note">开启后每 30 秒自动整理 Download 文件（按 classify 规则）；暂停时跳过整理但不关闭监控</div>
    <div id="monitorStatus" class="panel-note"></div>`;
  const refresh = async () => {
    const r = await api('/monitor', {method:'POST', body: JSON.stringify({action:'status'})});
    const st = r.status;
    $('monitorSw').checked = st === 'on' || st === 'paused';
    $('monitorPauseSw').checked = st === 'paused';
    const map = {on:'🟢 运行中', paused:'⏸ 已暂停', off:'⚪ 未启动'};
    $('monitorStatus').textContent = map[st] + (r.count ? ' · 已整理 '+r.count+' 个' : '') + (r.last ? ' · 最近 '+r.last : '');
  };
  $('monitorSw').onchange = async () => {
    await api('/monitor', {method:'POST', body: JSON.stringify({action: $('monitorSw').checked ? 'start' : 'stop'})});
    refresh();
  };
  $('monitorPauseSw').onchange = async () => {
    await api('/monitor', {method:'POST', body: JSON.stringify({action: $('monitorPauseSw').checked ? 'pause' : 'resume'})});
    refresh();
  };
  refresh();
}
function toolStats() {
  openPanel('📊 清理统计', `
    <div class="panel-note" id="stTotal"></div>
    <div class="bars" id="statsBars"></div>
    <div class="panel-note" id="stCats" style="margin-top:8px"></div>`);
  api('/stats').then(r => {
    const days = r.days||[];
    const max = Math.max(1, ...days.map(d=>d.items));
    $('statsBars').innerHTML = days.map(d => `
      <div class="bar"><div class="b" style="height:${(d.items/max*100).toFixed(0)}%"></div><div class="bl">${d.date}</div><div class="bl" style="font-size:8px;color:var(--text)">${d.items||''}</div></div>`).join('');
    $('stTotal').textContent = '累计清理 ' + (r.totalItems||0) + ' 项 · ' + fmt(r.totalSize||0);
  });
}

    <div class="row"><button class="primary" id="aiAsk">分析扫描结果</button></div>
    <div class="panel-list" id="aiResult"></div>`);
  $('aiAsk').onclick = async () => {
